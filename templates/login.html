{% extends "base.html" %}

{% block title %}Sign In — MindPath{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="twin-card p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="fs-1">🔐</span>
                <h2 class="fw-bold mt-2 mb-1">Student Sign In</h2>
                <p class="text-muted small">
                    Access your personalized MindPath learning dashboard.
                </p>
            </div>

            <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ email or '' }}" 
                               placeholder="Email" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Password" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to MindPath
                </button>
            </form>

            <div class="text-center mt-4 pt-2 border-top">
                <span class="text-muted small">New student?</span>
                <a href="{{ url_for('register') }}" class="ms-1 small fw-semibold text-primary">Register your account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
